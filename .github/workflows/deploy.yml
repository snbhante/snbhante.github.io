name: Deploy Next.js portfolio to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [config_updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v7

      - name: Checkout configuration source
        uses: actions/checkout@v7
        with:
          repository: snbhante/snbhante
          path: .config-source
          ref: main

      - name: Synchronize public configuration
        run: |
          rm -rf config
          cp -R .config-source/config ./config
          rm -rf .config-source

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Download required legacy assets
        run: npm run sync:assets

      - name: Validate configuration
        run: npm run validate:config

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
